project:
  type: book
  output-dir: _site
  preview:
    browser: true
  render:
    - index.qmd
    - pages/*.qmd
    - pages/workshop/*.qmd
    - ANNOUNCEMENTS.md
    - CODE_OF_CONDUCT.md
    - CONTRIBUTING.md
    - ACCESSIBILITY.md
    - SECURITY.md
    - AI_POLICY.md
    - CHANGELOG.md
    - "!AGENTS.md"
    - "!draft/"
    - "!*.rmd"

book:
  title: "Open and Reproducible Science in R"
  author:
    - name: "James Bristow"
      affiliation: "Massey University"
    - name: "Hana Liang"
      affiliation: "Bioeconomy Science Institute"
  doi: "10.5281/zenodo.24342489"
  output-file: open-and-reproducible-science-in-r
  downloads: [pdf]
  site-url: https://jbris.github.io/open-and-reproducible-science-in-r/
  repo-url: https://github.com/JBris/open-and-reproducible-science-in-r
  repo-actions: [issue]
  page-navigation: true
  description: Content for the Open and Reproducible Science in R workshop.
  open-graph: true
  twitter-card: true
  search:
    limit: 15
    type: overlay
  cookie-consent: false
  sidebar:
    style: docked
  chapters:
    - index.qmd
    - part: "Workshop Introduction"
      chapters:
        - pages/1_introduction.qmd
        - pages/2_coordinators.qmd
        - pages/3_attribution.qmd
    - part: "Workshop"
      chapters:
        - pages/workshop/00_preparation.qmd
        - pages/workshop/01_open_science.qmd
        - pages/workshop/02_git_github.qmd
        - pages/workshop/03_environments.qmd
    - part: "Communications and Community"
      chapters:
        - ANNOUNCEMENTS.md
        - CODE_OF_CONDUCT.md
        - CONTRIBUTING.md
        - ACCESSIBILITY.md
        - SECURITY.md
        - AI_POLICY.md
        - CHANGELOG.md

comments:
  hypothesis:
    theme: clean
    openSidebar: false

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
  pdf:
    documentclass: scrreprt
    pdf-engine: lualatex
    papersize: a4
    toc: true
    number-sections: true
    colorlinks: true
    geometry:
      - margin=1in

editor: source

execute:
  eval: false
